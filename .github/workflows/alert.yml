name: Data Breach Alert Cron

on:
  schedule:
    # 6시간마다 실행 (UTC 기준)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write # 👈 파이썬이 파일을 덮어쓸 수 있도록 쓰기 권한 부여

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Requirements
      run: pip install requests

    - name: Run News Alert Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python main.py

    # 👇 발송 기록 파일을 저장소에 덮어쓰는(Commit) 과정 추가
    - name: Commit seen articles
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add seen_articles.txt
        # 파일이 변경된 경우에만 커밋
        git commit -m "Update seen articles list [skip ci]" || echo "No changes to commit"
        git push
